name: Example SaaS Starter

on:
  pull_request:
    paths:
      - "examples/saas-tenant-dashboard/**"
      - ".github/workflows/example-saas.yml"
  push:
    branches: [main]
    paths:
      - "examples/saas-tenant-dashboard/**"
      - ".github/workflows/example-saas.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/saas-tenant-dashboard
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/saas-tenant-dashboard/package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
