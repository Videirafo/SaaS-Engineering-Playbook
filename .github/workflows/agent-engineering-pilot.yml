name: Agent Engineering Core Pilot (no deploy)

on:
  pull_request:
    paths:
      - "pilots/agent-engineering-core/**"
      - "docs/VIDEIRA_AGENT_ENGINEERING_CORE.md"
      - ".github/workflows/agent-engineering-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Offline contract tests
        run: node --test pilots/agent-engineering-core/validate.test.mjs
      - name: Valid fixture, always pilot only
        run: node pilots/agent-engineering-core/validate.mjs pilots/agent-engineering-core/fixtures/valid.json
